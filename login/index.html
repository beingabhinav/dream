<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamScape AI - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <div class="form-box">
            <h2>Welcome to DreamScape AI</h2>
            <div class="button-box">
                <button type="button" class="toggle-btn" onclick="showLogin()">Login</button>
                <button type="button" class="toggle-btn" onclick="showRegister()">Sign Up</button>
            </div>
            
            <form id="login" class="input-group">
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="submit-btn">Login</button>
                <p class="switch-text">Not registered? <a href="#" onclick="showRegister()">Sign up here</a></p>
            </form>

            <form id="register" class="input-group">
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" required minlength="8">
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Confirm Password" required minlength="8">
                </div>
                <button type="submit" class="submit-btn">Sign Up</button>
                <p class="switch-text">Already registered? <a href="#" onclick="showLogin()">Login here</a></p>
            </form>
        </div>
    </div>

    <script>
        // Form toggle functionality
        function showLogin() {
            document.getElementById("login").style.display = "block";
            document.getElementById("register").style.display = "none";
            document.querySelector('.form-box').classList.remove('register-mode');
        }
        
        function showRegister() {
            document.getElementById("login").style.display = "none";
            document.getElementById("register").style.display = "block";
            document.querySelector('.form-box').classList.add('register-mode');
        }

        // Form validation
        document.getElementById('register').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = this.querySelector('input[type="password"]');
            const confirmPassword = this.querySelectorAll('input[type="password"]')[1];
            
            if (password.value !== confirmPassword.value) {
                alert('Passwords do not match!');
                return;
            }
            
            // Add your registration logic here
            console.log('Registration form submitted');
        });

        document.getElementById('login').addEventListener('submit', function(e) {
            e.preventDefault();
            // Add your login logic here
            console.log('Login form submitted');
        });

        // Initialize with login form
        showLogin();
    </script>
</body>
</html>
